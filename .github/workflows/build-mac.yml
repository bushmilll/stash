# Builds Stash.app for Apple Silicon and Intel Macs on every push to main,
# tests the finished app, and publishes it as a downloadable .dmg on the Releases page.
name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and newer)
            arch: apple-silicon
          - runner: macos-15-intel    # older Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      STASH_VERSION: "0.1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python - <<'PY'
          import re, os
          p = "app/__init__.py"
          open(p, "w").write(f'__version__ = "{os.environ["STASH_VERSION"]}"\n')
          PY

      - name: Cache the AI model used by the tests
        uses: actions/cache@v4
        with:
          path: ~/stash-test-model
          key: clip-vit-b16-q-v1

      - name: Test the app before packaging
        run: STASH_SELFTEST=1 STASH_AI_TEST=1 STASH_MODEL_DIR="$HOME/stash-test-model" STASH_DATA="$RUNNER_TEMP/test-lib" STASH_PORT=8790 python stash_app.py

      - name: App icon
        run: |
          mkdir -p Stash.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon.png --out Stash.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d packaging/icon.png --out Stash.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns Stash.iconset -o packaging/Stash.icns

      - name: Package Stash.app
        run: pyinstaller --noconfirm --clean packaging/Stash.spec

      - name: Sign (ad hoc) so macOS will run it
        run: codesign --force --deep --sign - dist/Stash.app

      - name: Test the packaged app
        run: STASH_SELFTEST=1 STASH_AI_TEST=1 STASH_MODEL_DIR="$HOME/stash-test-model" STASH_DATA="$RUNNER_TEMP/test-lib-2" STASH_PORT=8791 ./dist/Stash.app/Contents/MacOS/Stash

      - name: Make the .dmg
        run: |
          mkdir dmg
          cp -R dist/Stash.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil is occasionally "resource busy" on CI machines: retry a few times
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Stash -srcfolder dmg -ov -format UDZO "Stash-${{ matrix.arch }}.dmg" && break
            echo "hdiutil failed (attempt $attempt), retrying"; sleep $((attempt * 10))
          done
          test -f "Stash-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Stash-${{ matrix.arch }}
          path: Stash-${{ matrix.arch }}.dmg

  release:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Check something was built
        run: ls out/*.dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Stash 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Download:** `Stash-apple-silicon.dmg` for M1/M2/M3/M4 Macs, `Stash-intel.dmg` for older Intel Macs.
            Not sure which? Apple menu > About This Mac: "Chip: Apple M…" means Apple Silicon.

            Changes: ${{ github.event.head_commit.message }}
          files: out/*.dmg
