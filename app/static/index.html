<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stash</title>
<link rel="stylesheet" href="/static/style.css">
<script>try{var t=localStorage.getItem("sf-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='6' y='6' width='9' height='9' fill='%23ECEAE5'/><rect x='17' y='6' width='9' height='9' fill='%23ECEAE5'/><rect x='6' y='17' width='9' height='9' fill='%23ECEAE5'/><rect x='17' y='17' width='9' height='9' fill='%23FF4D00'/></svg>">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">Stash</div>
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <header class="bar">
      <button class="cell only-mobile" id="menuBtn">Menu</button>
      <label class="cell search">
        <span class="lbl">Search</span>
        <span class="chips-in" id="chips"></span>
        <input id="q" type="search" placeholder="Captions, creators, tags, notes" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="cell hide-mobile sort-cell" id="sortCell"></div>
      <button class="cell hide-mobile" id="byImage" title="Find saves that look like an image (or drop one anywhere)">By image</button>
      <div class="cell toggle" role="group" aria-label="View">
        <button id="viewFrames">Frames</button><button id="viewIndex">Index</button>
      </div>
      <label class="cell hide-mobile"><span class="lbl">Size</span><input id="density" type="range" min="2" max="9" value="6" aria-label="Tile size"></label>
      <button class="cell hide-mobile" id="themeBtn"></button>
      <button class="cell update-pill" id="updateBtn" hidden title="A newer version of Stash is ready">Update</button>
      <button class="cell sync-pill" id="syncPill" title="Sync and settings"><span class="dot"></span><span id="syncText">Sync</span></button>
    </header>

    <div class="scope" id="scope"></div>
    <div class="filters" id="filters"></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <div class="sentinel" id="sentinel"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>

<div class="selbar" id="selbar" hidden></div>
<div class="dropzone" id="dropzone" hidden><div>Drop to find saves that look like this</div></div>
<input type="file" id="imageFile" accept="image/*" hidden>
<datalist id="collectionList"></datalist>
<div id="modalRoot"></div>

<!-- moodboard -->
<div class="board" id="board" hidden>
  <div class="board-bar">
    <button class="cell" id="boardClose" title="Back (Esc)">Back</button>
    <input class="cell title" id="boardTitle" aria-label="Moodboard name">
    <div class="cell toggle" role="group" aria-label="Arrange">
      <span class="lbl">Arrange</span>
      <button data-ly="sheet">Sheet</button><button data-ly="masonry">Columns</button><button data-ly="rows">Rows</button><button data-ly="collage">Collage</button>
    </div>
    <span class="spacer"></span>
    <button class="cell danger" id="boardDelete">Delete</button>
    <button class="cell" id="boardPdf">Export PDF</button>
    <button class="cell" id="boardVideo" title="An MP4 where looping video tiles play">Export video</button>
    <button class="cell primary" id="boardPng">Export PNG</button>
  </div>
  <div class="board-bar board-opts">
    <div class="cell toggle" role="group" aria-label="Title"><span class="lbl">Title</span><button data-title="top">Top</button><button data-title="bottom">Bottom</button><button data-title="off">Off</button></div>
    <div class="cell toggle" role="group" aria-label="Numbers" data-only="sheet"><span class="lbl">Numbered</span><button data-num="1">On</button><button data-num="0">Off</button></div>
    <div class="cell toggle" role="group" aria-label="Captions" data-only="sheet"><span class="lbl">Captions</span><button data-cap="full" title="Handle and the start of the caption">Full</button><button data-cap="handles" title="Just the handles">Handles</button><button data-cap="off">Off</button></div>
    <div class="cell toggle" role="group" aria-label="Tile shape" data-only="sheet"><span class="lbl">Tiles</span><button data-ar="orig" title="The standard 4:5 sheet">Original</button><button data-ar="1:1">1:1</button><button data-ar="3:2">3:2</button><button data-ar="16:9">16:9</button><button data-ar="9:16">9:16</button></div>
    <div class="cell toggle" role="group" aria-label="Images" data-only="sheet"><span class="lbl">Images</span><button data-fill="0" title="Show the whole image inside its tile">Fit</button><button data-fill="1" title="Crop the image to fill its tile">Fill</button></div>
    <div class="cell toggle" role="group" aria-label="Tilt" data-only="collage"><span class="lbl">Tilt</span><button data-tilt="0">Off</button><button data-tilt="1">On</button></div>
    <button class="cell" id="boardShuffle" data-only="collage" title="Scatter the posts into a new arrangement">Shuffle</button>
    <div class="cell toggle" role="group" aria-label="Layer" data-only="collage"><span class="lbl">Layer</span><button data-layer="back" title="Send to back (Shift+[)">To back</button><button data-layer="down" title="Back one ([)">Back</button><button data-layer="up" title="Forward one (])">Forward</button><button data-layer="front" title="Bring to front (Shift+])">To front</button></div>
    <div class="cell toggle" role="group" aria-label="Video labels"><span class="lbl">Video labels</span><button data-vl="1">On</button><button data-vl="0">Off</button></div>
    <div class="cell toggle" role="group" aria-label="Loops"><span class="lbl">Loops</span><button data-motion="1" title="Play looping video tiles on the board">Play</button><button data-motion="0" title="Hold every tile still">Pause</button></div>
    <label class="cell"><span class="lbl">Space</span><input type="range" id="boardGap" min="0" max="40" value="12" aria-label="Spacing"></label>
    <div class="cell"><span class="lbl">Ground</span><div class="swatches" id="swatches"></div></div>
    <button class="cell" id="addNote">Add note</button>
    <span class="spacer"></span>
  </div>
  <div class="board-scroll" id="boardScroll"><div class="paper-wrap" id="paperWrap"><div class="paper" id="paper"></div></div></div>
  <div class="clip-panel" id="clipPanel" hidden></div>
  <div class="board-foot"><span id="boardInfo"></span><span id="boardHint"></span></div>
</div>

<!-- viewer -->
<div class="viewer" id="viewer" hidden>
  <div class="stage" id="stage">
    <div class="frame" id="frame"></div>
    <div class="slides" id="slides"></div>
    <div class="deck" id="deck" hidden>
      <div class="scrub" id="scrub">
        <div class="range" id="range"></div>
        <div class="played" id="played"></div>
        <div class="mark in" id="markIn"></div>
        <div class="mark out" id="markOut"></div>
        <div class="head" id="head"></div>
      </div>
      <div class="deck-row">
        <button class="cell" id="play">Play</button>
        <span class="cell tc" id="tc">00:00.00</span>
        <button class="cell" id="mute" title="Sound on/off (M)">Unmute</button>
        <button class="cell" id="stepBack" title="Back one frame (,)">− Frame</button>
        <button class="cell" id="stepFwd" title="Forward one frame (.)">+ Frame</button>
        <span class="spacer"></span>
        <button class="cell" id="setIn" title="Set in point (I). Click again to clear">In <span class="tc" id="inTc">–</span></button>
        <button class="cell" id="setOut" title="Set out point (O). Click again to clear">Out <span class="tc" id="outTc">–</span></button>
        <button class="cell" id="preview" title="Play just the marked section, on a loop (P)" disabled>Preview</button>
        <button class="cell primary" id="grab" title="Save full-res frame (G)">Grab frame</button>
      </div>
    </div>
  </div>
  <aside class="info" id="info"></aside>
</div>

<!-- settings -->
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Sync and settings">
  <div class="drawer-head">
    <h2>Sync and settings</h2>
    <button class="cell" id="closeDrawer">Close</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
<script src="/static/board.js"></script>
</body>
</html>
